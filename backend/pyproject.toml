[project]
name = "picoseek-backend"
version = "0.1.0"
description = "PicoSeek REST/SSE 后端（FastAPI + arq worker）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "picoseek-core[embed,paywall]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "arq>=0.26",
  "redis>=5",
  "sse-starlette>=2.1",
  "argon2-cffi>=25.1",
  "python-multipart>=0.0.20",
  # PDF 导出：markdown-it-py 渲染正文（自定义引用芯片规则），jinja2 组装打印用 HTML
  "markdown-it-py>=3",
  "jinja2>=3.1",
  # codex 引擎：SDK 依赖 openai-codex-cli-bin，二进制随 wheel 进镜像，容器内无需 node
  "openai-codex>=0.147",
]

[project.scripts]
picoseek = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
