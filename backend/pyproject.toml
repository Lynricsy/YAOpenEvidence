[project]
name = "yaoe-backend"
version = "0.1.0"
description = "YAOpenEvidence REST/SSE 后端（FastAPI + arq worker）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "picosgpt-core[embed]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "arq>=0.26",
  "redis>=5",
  "sse-starlette>=2.1",
]

[project.scripts]
yaoe = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
