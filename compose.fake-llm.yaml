services:
  fake-llm:
    build: { context: ., target: test }
    image: yaoe:test
    command: ["python", "-m", "tests.fake_llm", "--port", "4000"]
    working_dir: /app/backend

  api:
    environment: { LLM_BASE: http://fake-llm:4000/v1 }
    depends_on: { fake-llm: { condition: service_started } }

  worker:
    environment: { LLM_BASE: http://fake-llm:4000/v1 }
    depends_on: { fake-llm: { condition: service_started } }
