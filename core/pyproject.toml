[project]
name = "picosgpt-core"
version = "0.1.0"
description = "PICOSGpt 内核：文献检索、全文解析、原子知识库、期刊分区"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "numpy>=1.26", "pypdf>=4", "mcp>=1.29,<2"]

[project.optional-dependencies]
embed = ["torch>=2.2", "sentence-transformers>=3"]
paywall = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "picos_paths",
  "literature",
  "ask",
  "knowledge_store",
  "journal_rank",
  "semantic_scholar_mcp",
  "paywall_fetch",
  "spider_auth",
  "verify_citations",
  "ingest",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
