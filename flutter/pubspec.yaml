name: yaopenevidence
description: "YAOpenEvidence 移动/桌面客户端：基于文献证据的临床问答。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 路由
  go_router: ^18.0.1

  # 模型
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 网络（含 SSE 流式读取）
  http: ^1.6.0

  # 存储
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Markdown 解析（渲染自实现）
  markdown: ^7.3.1

  # 外链
  url_launcher: ^6.3.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_lint: ^3.1.9
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-VF.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
