server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker 内嵌 DNS。字面量 proxy_pass http://api:8765 只在启动时解析一次并永久缓存，
    # api 容器重建换 IP 后 nginx 仍打旧地址，整站 502 直到 web 一起重启；
    # 走变量式 proxy_pass 会按 valid 周期重新解析，api 可独立重建。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 必须回源校验：文件名没有指纹，nginx 默认只发 ETag/Last-Modified，
    # 浏览器会按启发式新鲜度直接复用旧副本——部署完用户仍停在上一版前端，
    # 而 /assets 是 immutable 的指纹文件，旧 index 会一直引用旧 chunk。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
